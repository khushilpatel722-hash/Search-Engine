<form class="searchbox{{ ' big' if sb_big }}" id="searchForm" action="{{ url_for('page_search') }}" method="get" role="search" autocomplete="off">
  <div class="sb-field">
    <svg class="i sb-icon"><use href="#i-search"/></svg>
    <input type="text" id="q" name="q" placeholder="Search your private documents…" maxlength="200" aria-label="Search query" autocomplete="off">
    {% if sb_clear %}<button type="button" class="sb-clear" id="clearBtn" hidden aria-label="Clear search"><svg class="i"><use href="#i-x"/></svg></button>{% endif %}
    <button type="submit" class="btn primary sb-go">Search Privately</button>
  </div>
  <ul class="suggest" id="suggest" role="listbox" hidden></ul>
</form>
